<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST API Playground</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>REST API Playground</h1>
          <p class="sub">index.html이 Express `/api`와 통신하는 과정을 실시간으로 봅니다.</p>
        </div>
        <div class="health">
          <span id="health-dot" class="dot"></span>
          <span id="health-status">연결 확인 중...</span>
        </div>
      </header>

      <section class="grid">
        <article class="panel">
          <h2>1. HTTP 메서드 실행</h2>
          <div class="methods">
            <button id="btn-health" class="m-GET">GET /health</button>
            <button id="btn-list" class="m-GET">GET /items</button>
            <button id="btn-get" class="m-GET">GET /items/:id</button>
            <button id="btn-post" class="m-POST">POST /items</button>
            <button id="btn-put" class="m-PUT">PUT /items/:id</button>
            <button id="btn-patch" class="m-PATCH">PATCH /items/:id</button>
            <button id="btn-delete" class="m-DELETE">DELETE /items/:id</button>
          </div>

          <div class="form">
            <label for="item-id">대상 ID</label>
            <input id="item-id" type="number" min="1" value="2" />
            <label for="title">title (POST / PUT)</label>
            <input id="title" type="text" placeholder="예: 새 할 일 추가" />
          </div>

          <h2>2. 서버 데이터</h2>
          <div id="items" class="items"></div>
        </article>

        <article class="panel inspector">
          <h2>3. 요청 / 응답</h2>
          <div class="pair">
            <div>
              <span class="badge m-GET">Request</span>
              <pre id="request">대기 중...</pre>
            </div>
            <div>
              <span class="badge m-POST">Response</span>
              <div id="response-meta" class="meta">-</div>
              <pre id="response">대기 중...</pre>
            </div>
          </div>
        </article>
      </section>

      <section class="panel log">
        <h2>4. 통신 로그</h2>
        <div id="log"></div>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
