<!DOCTYPE html>

<html lang="ko"><head>

<title>로그인 - AI 재무 인터렉티브</title>
<!-- Google Fonts -->

            line-height: 1;

            white-space: nowrap;

            -webkit-font-smoothing: antialiased;
        }

            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 1.5s linear infinite;
        }

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#001c38",
                        "secondary-container": "#7db6ff",
                        "tertiary-fixed": "#6ffbbe",
                        "on-error-container": "#93000a",
                        "surface-variant": "#d3e4fe",
                        "on-secondary-container": "#00477f",
                        "surface-tint": "#455f88",
                        "surface-bright": "#f8f9ff",
                        "on-secondary-fixed-variant": "#004881",
                        "tertiary-container": "#003e28",
                        "surface": "#f8f9ff",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#002617",
                        "secondary-fixed": "#d3e4ff",
                        "secondary-fixed-dim": "#a2c9ff",
                        "primary-fixed-dim": "#adc7f7",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#dce9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "primary-container": "#1a365d",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "error": "#ba1a1a",
                        "secondary": "#1960a3",
                        "outline-variant": "#c4c6cf",
                        "on-primary-container": "#86a0cd",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-tertiary-container": "#00b47d",
                        "on-background": "#0b1c30",
                        "background": "#f8f9ff",
                        "primary-fixed": "#d6e3ff",
                        "on-primary-fixed": "#001b3c",
                        "on-surface": "#0b1c30",
                        "primary": "#002045",
                        "on-tertiary-fixed": "#002113",
                        "surface-dim": "#cbdbf5",
                        "surface-container": "#e5eeff",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#adc7f7",
                        "on-surface-variant": "#43474e",
                        "inverse-surface": "#213145",
                        "on-primary-fixed-variant": "#2d476f",
                        "on-tertiary-fixed-variant": "#005236",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "outline": "#74777f",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "unit": "4px",
                        "container-max": "1280px",
                        "xs": "4px",

                        "md": "16px",

                        "xl": "48px",

                    "boxShadow": {
                        "level-1": "0px 2px 4px rgba(0,0,0,0.05)",
                        "level-2": "0px 10px 15px rgba(0,0,0,0.08)"

</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Container / Card (Level 1 Elevation) -->
<div class="w-full max-w-[440px] bg-surface rounded-xl shadow-level-1 border border-outline-variant p-lg md:p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-sm">
<div class="w-12 h-12 bg-primary-container text-on-primary-container rounded-lg flex items-center justify-center mb-sm shadow-level-1">
<span class="material-symbols-outlined text-[28px]" data-icon="account_balance">account_balance</span>
</div>
<h1 class="text-headline-md font-headline-md text-primary m-0 tracking-tight">AI 재무 인터렉티브</h1>
<p class="text-body-md font-body-md text-on-surface-variant m-0 mt-xs">
                인공지능과 함께 현재 재무상태를 확인하고<br class="hidden sm:block"/> 더 나은 금융계획을 세워보세요.
            </p>
</div>
<!-- Error Message (Hidden by default, used for interaction demo) -->
<div class="hidden bg-error-container border border-error/20 rounded-lg p-md flex items-start gap-sm" id="error-message">
<span class="material-symbols-outlined text-error" data-icon="error" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="text-body-sm font-body-sm text-on-error-container pt-[2px]">이메일 또는 비밀번호가 올바르지 않습니다. 다시 시도해 주세요.</span>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" id="login-form" onsubmit="handleLogin(event)">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="email">이메일</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant/50" data-icon="mail">mail</span>
<input class="w-full h-[48px] pl-[44px] pr-md bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="email" name="email" placeholder="이메일 주소" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="password">비밀번호</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant/50" data-icon="lock">lock</span>
<input class="w-full h-[48px] pl-[44px] pr-md bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-sm">
<button class="w-full h-[48px] bg-primary text-on-primary rounded-lg text-label-md font-label-md flex items-center justify-center gap-sm hover:bg-primary-fixed-dim hover:text-on-primary-fixed transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="submit-btn" type="submit">
<span class="" id="btn-text">로그인</span>
<span class="material-symbols-outlined hidden animate-spin-slow" data-icon="progress_activity" id="btn-spinner">progress_activity</span>
</button>
</div>
</form>
<!-- Links -->
<div class="flex flex-col gap-md pt-sm border-t border-outline-variant/30">
<div class="flex justify-center items-center gap-md">
<a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">아이디 찾기</a>
<span class="w-[1px] h-3 bg-outline-variant/50"></span>
<a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">비밀번호 찾기</a>
</div>
<div class="text-center">
<p class="text-body-sm font-body-sm text-on-surface-variant">
                    계정이 없으신가요? <a class="text-secondary font-medium hover:underline" href="{{DATA:SCREEN:SCREEN_82}}">회원가입</a>
</p>
</div>
</div>
</div>
<script>
        function handleLogin(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            const errorMsg = document.getElementById('error-message');
            
            // Reset state
            errorMsg.classList.add('hidden');
            
            // Loading state
            btn.disabled = true;
            btn.classList.add('opacity-90', 'cursor-not-allowed');
            btnText.textContent = '확인 중...';
            spinner.classList.remove('hidden');
            
            // Simulate API call
            setTimeout(() => {
                // Restore state and show error to demonstrate feedback
                btn.disabled = false;
                btn.classList.remove('opacity-90', 'cursor-not-allowed');
                btnText.textContent = '로그인';
                spinner.classList.add('hidden');
                
                errorMsg.classList.remove('hidden');
                
                // Shake effect on card for feedback
                const card = errorMsg.parentElement;
                card.style.transform = 'translateX(5px)';
                setTimeout(() => card.style.transform = 'translateX(-5px)', 50);
                setTimeout(() => card.style.transform = 'translateX(3px)', 100);
                setTimeout(() => card.style.transform = 'translateX(-3px)', 150);
                setTimeout(() => card.style.transform = 'translateX(0)', 200);
                card.style.transition = 'transform 0.1s ease-in-out';
                
            }, 1500);
        }
    </script>
</body></html>
