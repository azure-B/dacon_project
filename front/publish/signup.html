<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>회원가입 - AI 재무 인터렉티브</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#7db6ff",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#005236",
                        "outline": "#74777f",
                        "error": "#ba1a1a",
                        "surface": "#f8f9ff",
                        "surface-container-low": "#eff4ff",
                        "surface-container": "#e5eeff",
                        "primary-fixed-dim": "#adc7f7",
                        "inverse-surface": "#213145",
                        "surface-container-highest": "#d3e4fe",
                        "primary": "#002045",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#a2c9ff",
                        "tertiary-fixed-dim": "#4edea3",
                        "secondary": "#1960a3",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-variant": "#d3e4fe",
                        "primary-fixed": "#d6e3ff",
                        "on-tertiary-fixed": "#002113",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-container": "#003e28",
                        "background": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#002617",
                        "outline-variant": "#c4c6cf",
                        "on-primary-fixed": "#001b3c",
                        "on-secondary-container": "#00477f",
                        "on-surface": "#0b1c30",
                        "on-primary-container": "#86a0cd",
                        "inverse-primary": "#adc7f7",
                        "on-tertiary-container": "#00b47d",
                        "on-surface-variant": "#43474e",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#004881",
                        "surface-tint": "#455f88",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#d3e4ff",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-fixed": "#001c38",
                        "surface-dim": "#cbdbf5",
                        "on-primary-fixed-variant": "#2d476f",
                        "primary-container": "#1a365d",
                        "on-background": "#0b1c30"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "container-max": "1280px",
                        "md": "16px",
                        "xl": "48px",
                        "gutter": "24px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "unit": "4px",
                        "xs": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter", "sans-serif"],
                        "headline-lg-mobile": ["Inter", "sans-serif"],
                        "label-sm": ["Inter", "sans-serif"],
                        "headline-sm": ["Inter", "sans-serif"],
                        "body-sm": ["Noto Sans KR", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "body-lg": ["Noto Sans KR", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "body-md": ["Noto Sans KR", "sans-serif"],
                        "display-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.03em", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<main class="w-full max-w-[480px]">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-md md:p-xl">
<div class="text-center mb-xl">
<h1 class="text-headline-lg font-headline-lg text-primary mb-sm font-inter">AI 재무 인터렉티브</h1>
<p class="text-body-md font-body-md text-on-surface-variant">기관 수준의 분석 플랫폼에 오신 것을 환영합니다. 계정을 생성하여 시작하세요.</p>
</div>
<form action="#" class="space-y-gutter" method="POST">
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface" for="name">이름</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-[12px] md:py-sm text-body-sm font-body-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-shadow text-on-surface placeholder-outline" id="name" name="name" placeholder="홍길동" required="" type="text"/>
</div>
</div>
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface" for="email">이메일 주소</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-[12px] md:py-sm text-body-sm font-body-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-shadow text-on-surface placeholder-outline" id="email" name="email" placeholder="이메일@회사.com" required="" type="email"/>
</div>
</div>
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface" for="password">비밀번호 설정</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-[12px] md:py-sm text-body-sm font-body-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-shadow text-on-surface placeholder-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<p class="text-label-sm font-label-sm text-on-surface-variant">최소 8자 이상, 영문, 숫자, 특수문자를 포함해야 합니다.</p>
</div>
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface" for="password_confirm">비밀번호 확인</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock_reset</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-[12px] md:py-sm text-body-sm font-body-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-shadow text-on-surface placeholder-outline" id="password_confirm" name="password_confirm" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-start mt-md">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-sm text-body-sm font-body-sm">
<label class="text-on-surface-variant cursor-pointer" for="terms">
<a class="text-secondary hover:underline font-medium" href="#">서비스 이용약관</a> 및 <a class="text-secondary hover:underline font-medium" href="#">개인정보 처리방침</a>에 동의합니다.
                        </label>
</div>
</div>
<div class="pt-md">
<button class="w-full flex justify-center py-[14px] md:py-[10px] px-md border border-transparent rounded-lg shadow-sm text-label-md font-label-md text-on-primary bg-secondary hover:bg-on-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                        회원가입 완료
                    </button>
</div>
</form>
<div class="mt-lg text-center">
<p class="text-body-sm font-body-sm text-on-surface-variant">
                    이미 계정이 있으신가요? <a class="text-secondary font-medium hover:underline" href="#">로그인</a>
</p>
</div>
</div>
</main>
</body></html>
